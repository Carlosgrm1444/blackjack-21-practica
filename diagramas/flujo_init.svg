<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2450" viewBox="0 0 1200 2450" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">Blackjack 21: flujo de init con tres bucles while</title>
<desc id="descripcion">El ciclo principal repite rondas mientras haya saldo y se desee continuar. El blackjack inicial omite los turnos. El jugador repite acciones hasta terminar sus manos; después el crupier pide hasta 17. Se liquida una vez por ronda y se guarda la decisión de continuar.</desc>
